rm_custom_controller_state:

  left_arm_state_topic: {
    type: string,
    description: "ROS topic for the left arm controller state messages.",
  }

  right_arm_state_topic: {
    type: string,
    description: "ROS topic for the right arm controller state messages.",
  }

  left_joint_names: {
    type: string_array,
    description: "List of joint names for the left arm. 长度为 6。",
  }

  right_joint_names: {
    type: string_array,
    description: "List of joint names for the right arm. 长度为 6。",
  }

  ref_topic: {
    type: string,
    description: "ROS topic for the references system messages.",
  }

  watchdog_timeout: {
    type: double,
    default_value: 1.0,
    description: "Watchdog timeout in seconds. If no command is received within this time, a warning will be issued.",
    validation: {
      gt<>: [0.0]
    }
  }

  chassis_cmd_topic: {
    type: string,
    default_value: "/chassis_cmd_vel",
    description: "ROS topic for chassis velocity command (TwistStamped)."
  }

  enable_chassis_cmd: {
    type: bool,
    default_value: true,
    description: "Enable chassis command publishing from channel data."
  }

  max_linear_x: {
    type: double,
    default_value: 1.0,
    description: "Maximum linear velocity in x direction (m/s).",
    validation: {
      gt<>: [0.0]
    }
  }

  max_linear_y: {
    type: double,
    default_value: 1.0,
    description: "Maximum linear velocity in y direction (m/s).",
    validation: {
      gt<>: [0.0]
    }
  }

  max_angular_z: {
    type: double,
    default_value: 1.0,
    description: "Maximum angular velocity in z direction (rad/s).",
    validation: {
      gt<>: [0.0]
    }
  }
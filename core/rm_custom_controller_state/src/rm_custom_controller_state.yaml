rm_custom_controller_state:

  arm_state_topic: {
    type: string,
    description: "ROS topic for the single arm controller state messages.",
  }

  joint_names: {
    type: string_array,
    description: "List of joint names for the single arm. 长度为 7。",
    validation: {
      fixed_size<>: [7]
    }
  }

  message_model: {
    type: int,
    description: "1 or 2, 1 means the orignial comunication rules, 2 means the only joints message rules.",
    default_value: 1,
    validation: {
      one_of<>: [[1,2]]
    }
  }

  joint_reverse: {
    type: bool_array,
    default_value: [false, false, false, false, false, false, false],
    description: "Reverse flag for each arm joint. 长度为 7。",
    validation: {
      fixed_size<>: [7]
    }
  }

  ref_topic: {
    type: string,
    description: "ROS topic for the references system messages.",
  }

  watchdog_timeout: {
    type: double,
    default_value: 1.0,
    description: "Watchdog timeout in seconds. If no command is received within this time, a warning will be issued.",
    validation: {
      gt<>: [0.0]
    }
  }

  chassis_cmd_topic: {
    type: string,
    default_value: "~/chassis_cmd_vel",
    description: "ROS topic for chassis velocity command (TwistStamped)."
  }

  enable_chassis_cmd: {
    type: bool,
    default_value: true,
    description: "Enable chassis command publishing from channel data."
  }

  channel_mapping: {
    type: string_array,
    default_value: ["linear_x", "linear_y", "angular_z", "none"],
    description: "Mapping for each channel. Options: 'linear_x', 'linear_y', 'angular_z', 'none'. Length must be 4.",
    validation: {
      fixed_size<>: [4]
    }
  }

  channel_max: {
    type: double_array,
    default_value: [1.0, 1.0, 1.0, 1.0],
    description: "Maximum value for each channel output. Length must be 4.",
    validation: {
      fixed_size<>: [4],
      element_bounds<>: [-100.0, 100.0]
    }
  }

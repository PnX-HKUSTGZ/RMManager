rm_custom_controller_state:
  ros__parameters:

    arm_state_topic: "/custom_controller/joint_states"

    joint_names:
      - "control_j0"
      - "control_j1"
      - "control_j2"
      - "control_j3"
      - "control_j4"
      - "control_j5"
      - "control_j6"

    joint_reverse: [false, false, false, false, false, false, false]

    ref_topic: /rm_manager/custom_controller
    
    # 看门狗超时时间（秒）- 如果在此时间内没有收到命令则发出警报
    watchdog_timeout: 1.0

rm_custom_controller_imu:
  ros__parameters:
    # 裁判系统数据topic
    ref_topic: "/rm_manager/custom_controller"
    
    # 看门狗超时时间（秒）
    watchdog_timeout: 1.0
    
    # ControlData1 (0xA1) - TF2变换参数
    parent_frame: "base_link"
    child_frame: "~/controller_imu"
    pose_topic: "/custom_control/left_arm/pose_command"
    position_scale_x: 0.3
    position_scale_y: 0.3
    position_scale_z: 0.3
    position_start_x: 0.09
    position_start_y: 0.20
    position_start_z: 0.35
    orientation_offset_roll: 1.5707963
    orientation_offset_pitch: 3.1415926
    orientation_offset_yaw: 0.0
    
    # ControlData2 (0xA2) - Twist命令参数
    enable_twist_cmd: true
    twist_cmd_topic: "~/twist_cmd"
    
    # 通道映射: channel_0~3 映射到 twist 的不同轴
    # 可选值: "linear_x", "linear_y", "angular_z", "none"
    channel_mapping: ["linear_x", "linear_y", "angular_z", "none"]
    
    # 通道最大值（归一化后的缩放系数）
    channel_max: [1.0, 1.0, 1.0, 1.0]

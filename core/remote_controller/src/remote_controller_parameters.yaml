remote_controller:
  cmd_vel_topic:
    type: string
    default_value: "/mcknum_controller/reference"
    description: "Topic for publishing velocity commands"
    read_only: false
    
  remote_controller_topic:
    type: string
    default_value: "/rm_manager/remote_control"
    description: "Topic for subscribing to remote control messages"
    read_only: false
    
  chasis_enable_topic:
    type: string
    default_value: "/enable_chasis"
    description: "Topic for publishing chassis enable status"
    read_only: false
    
  arm_enable_topic:
    type: string
    default_value: "/enable_arm"
    description: "Topic for publishing arm enable status"
    read_only: false
    
  max_x:
    type: double
    default_value: 0.5
    description: "Maximum linear velocity in x direction (m/s)"
    read_only: false
    validation:
      bounds<>: [0.0, 10.0]
    
  max_y:
    type: double
    default_value: 0.5
    description: "Maximum linear velocity in y direction (m/s)"
    read_only: false
    validation:
      bounds<>: [0.0, 10.0]
    
  max_z:
    type: double
    default_value: 0.5
    description: "Maximum angular velocity in z direction (rad/s)"
    read_only: false
    validation:
      bounds<>: [0.0, 10.0]
    
  delta_x:
    type: double
    default_value: 1000.0
    description: "Maximum acceleration in x direction (m/s²)"
    read_only: false
    validation:
      bounds<>: [0.0, 10000.0]
    
  delta_y:
    type: double
    default_value: 1000.0
    description: "Maximum acceleration in y direction (m/s²)"
    read_only: false
    validation:
      bounds<>: [0.0, 10000.0]
    
  delta_z:
    type: double
    default_value: 1000.0
    description: "Maximum angular acceleration in z direction (rad/s²)"
    read_only: false
    validation:
      bounds<>: [0.0, 10000.0]

  keyboard_forward_key:
    type: string
    default_value: "W"
    description: "Key for moving forward in keyboard remote control mode"
    read_only: true
    validation:
      one_of<>: [["W", "S", "A", "D", "SHIFT", "CTRL", "Q", "E", "R", "F", "G", "Z", "X", "C", "V", "B"]]
    
  keyboard_backward_key:
    type: string
    default_value: "S"
    description: "Key for moving backward in keyboard remote control mode"
    read_only: true
    validation:
      one_of<>: [["W", "S", "A", "D", "SHIFT", "CTRL", "Q", "E", "R", "F", "G", "Z", "X", "C", "V", "B"]]
    
  keyboard_left_key:
    type: string
    default_value: "A"
    description: "Key for moving left in keyboard remote control mode"
    read_only: true
    validation:
      one_of<>: [["W", "S", "A", "D", "SHIFT", "CTRL", "Q", "E", "R", "F", "G", "Z", "X", "C", "V", "B"]]

  keyboard_right_key:
    type: string
    default_value: "D"
    description: "Key for moving right in keyboard remote control mode"
    read_only: true
    validation:
      one_of<>: [["W", "S", "A", "D", "SHIFT", "CTRL", "Q", "E", "R", "F", "G", "Z", "X", "C", "V", "B"]]

  keyboard_up_key:
    type: string
    default_value: "SHIFT"
    description: "Key for moving up in keyboard remote control mode"
    read_only: true
    validation:
      one_of<>: [["W", "S", "A", "D", "SHIFT", "CTRL", "Q", "E", "R", "F", "G", "Z", "X", "C", "V", "B"]]

  keyboard_down_key:
    type: string
    default_value: "CTRL"
    description: "Key for moving down in keyboard remote control mode"
    read_only: true
    validation:
      one_of<>: [["W", "S", "A", "D", "SHIFT", "CTRL", "Q", "E", "R", "F", "G", "Z", "X", "C", "V", "B"]]

  keyboard_up_ratio:
    type: double
    default_value: 1.5
    description: "Speed ratio for upward movement in keyboard remote control mode"
    read_only: true
    validation:
      bounds<>: [1.0, 5.0]

  keyboard_down_ratio:
    type: double
    default_value: 0.5
    description: "Speed ratio for downward movement in keyboard remote control mode"
    read_only: true
    validation:
      bounds<>: [0.0, 1.0]
    
  keyboard_mousex_scale:
    type: double
    default_value: -0.05
    description: "Scale factor for mouse X movement in keyboard remote control mode"
    read_only: true
    

  control_source_switch_key:
    type: string
    default_value: "KEYL"
    description: "Key to switch control source (remote channel -> keyboard/mouse -> bridge topics)"
    read_only: true
    validation:
      one_of<>: [["STOP", "KEYL", "KEYR", "KEYB", "PRESSL", "PRESSR", "PRESSMID", "W", "S", "A", "D", "SHIFT", "CTRL", "Q", "E", "R", "F", "G", "Z", "X", "C", "V", "B"]]

  bridge_topics:
    type: string_array
    default_value: []
    read_only: false
    description: "List of topics for bridging velocity commands from external sources (geometry_msgs/msg/TwistStamped)"

  target_bottons:
    type: string_array
    default_value: []
    read_only: true
    description: "List of target buttons for remote control"
    validation:
      subset_of<>: [["STOP", "KEYL", "KEYR", "KEYB", "PRESSL", "PRESSR", "PRESSMID", "W", "S", "A", "D", "SHIFT", "CTRL", "Q", "E", "R", "F", "G", "Z", "X", "C", "V", "B"]]
  
  on_state:
    type: string_array
    default_value: []
    read_only: true
    description: "List of states when the action of the button is ON, ON_REALSED is for momentary buttons, ON_PRESSED is for press buttons, ON_TOGGLED is for toggle buttons"
    validation:
      subset_of<>: [["ON_REALSED", "ON_PRESSED", "ON_TOGGLED", "ON_REALSED_OFF", "ON_PRESSED_OFF"]]

  on_action_topic:
    type: string_array
    default_value: []
    read_only: true
    description: "List of topics to publish when the button action is ON, type is std_msgs/msg/Bool"
  
  on_action_content:
    type: bool_array
    default_value: []
    read_only: true
    description: "List of content to publish when the button action is ON"

  watchdog_timeout:
    type: double
    default_value: 1.0
    description: "Watchdog timeout in seconds. If no remote control message is received within this time, disable signal will be sent"
    read_only: false
    validation:
      bounds<>: [0.1, 10.0]

  watchdog_enabled:
    type: bool
    default_value: true
    description: "Enable or disable the watchdog timer"
    read_only: false
remote_controller:
  cmd_vel_topic:
    type: string
    default_value: "/mcknum_controller/reference"
    description: "Topic for publishing velocity commands"
    read_only: false
    
  remote_controller_topic:
    type: string
    default_value: "/rm_manager/remote_control"
    description: "Topic for subscribing to remote control messages"
    read_only: false
    
  chasis_enable_topic:
    type: string
    default_value: "/enable_chasis"
    description: "Topic for publishing chassis enable status"
    read_only: false
    
  arm_enable_topic:
    type: string
    default_value: "/enable_arm"
    description: "Topic for publishing arm enable status"
    read_only: false
    
  max_x:
    type: double
    default_value: 0.5
    description: "Maximum linear velocity in x direction (m/s)"
    read_only: false
    validation:
      bounds<>: [0.0, 10.0]
    
  max_y:
    type: double
    default_value: 0.5
    description: "Maximum linear velocity in y direction (m/s)"
    read_only: false
    validation:
      bounds<>: [0.0, 10.0]
    
  max_z:
    type: double
    default_value: 0.5
    description: "Maximum angular velocity in z direction (rad/s)"
    read_only: false
    validation:
      bounds<>: [0.0, 10.0]
    
  delta_x:
    type: double
    default_value: 1000.0
    description: "Maximum acceleration in x direction (m/s²)"
    read_only: false
    validation:
      bounds<>: [0.0, 10000.0]
    
  delta_y:
    type: double
    default_value: 1000.0
    description: "Maximum acceleration in y direction (m/s²)"
    read_only: false
    validation:
      bounds<>: [0.0, 10000.0]
    
  delta_z:
    type: double
    default_value: 1000.0
    description: "Maximum angular acceleration in z direction (rad/s²)"
    read_only: false
    validation:
      bounds<>: [0.0, 10000.0]

  target_bottons:
    type: string_array
    default_value: []
    read_only: true
    description: "List of target buttons for remote control"
    validation:
      subset_of<>: [["STOP", "KEYL", "KEYR", "KEYB", "PRESSL", "PRESSR", "PRESSMID", "W", "S", "A", "D", "SHIFT", "CTRL", "Q", "E", "R", "F", "G", "Z", "X", "C", "V", "B"]]
  
  on_state:
    type: string_array
    default_value: []
    read_only: true
    description: "List of states when the action of the button is ON, ON_REALSED is for momentary buttons, ON_PRESSED is for press buttons, ON_TOGGLED is for toggle buttons"
    validation:
      subset_of<>: [["ON_REALSED", "ON_PRESSED", "ON_TOGGLED", "ON_REALSED_OFF", "ON_PRESSED_OFF"]]

  on_action_topic:
    type: string_array
    default_value: []
    read_only: true
    description: "List of topics to publish when the button action is ON, type is std_msgs/msg/Bool"
  
  on_action_content:
    type: bool_array
    default_value: []
    read_only: true
    description: "List of content to publish when the button action is ON"